Include "D:/Epsilon Resource Planner Project/react-main  branch/epsilon-resource-planner/apache/paths.conf"
WSGIApplicationGroup %{GLOBAL}

<VirtualHost *:81>
    ServerName ${SERVER_NAME}

    # -------- Frontend (React) --------
    DocumentRoot "${FRONTEND_PATH}"
    <Directory "${FRONTEND_PATH}">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteRule ^config\.js$ - [L]

    # Don't rewrite API calls
    RewriteCond %{REQUEST_URI} ^/api(/|$) [NC]
    RewriteRule ^ - [L]

    # Serve existing files/dirs
    RewriteCond "%{DOCUMENT_ROOT}%{REQUEST_FILENAME}" -f [OR]
    RewriteCond "%{DOCUMENT_ROOT}%{REQUEST_FILENAME}" -d
    RewriteRule ^ - [L]

    # SPA fallback
    RewriteRule ^ /index.html [L]

    # -------- Backend (mod_wsgi) at /api --------
    WSGIScriptAlias /api "${BACKEND_PATH}/wsgi.py"
    <Directory "${BACKEND_PATH}">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog "${APACHE_LOG_DIR}/epsilon-resource-planner_error.log"
    CustomLog "${APACHE_LOG_DIR}/epsilon-resource-planner_access.log" combined
</VirtualHost>
