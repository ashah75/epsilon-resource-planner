<VirtualHost *:443>
    ServerName resource-planner.example.com

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/resource-planner.crt
    SSLCertificateKeyFile /etc/ssl/private/resource-planner.key

    # Mutual TLS
    SSLVerifyClient require
    SSLVerifyDepth 2
    SSLCACertificateFile /etc/ssl/certs/client-ca.crt

    # React build
    DocumentRoot /var/www/epsilon-resource-planner/frontend/dist
    <Directory /var/www/epsilon-resource-planner/frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # SPA routing
    RewriteEngine On
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ /index.html [L]

    # API reverse proxy (uWSGI backend)
    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:8000/api/
    ProxyPassReverse /api/ http://127.0.0.1:8000/api/

    # Rate limiting (mod_ratelimit)
    SetOutputFilter RATE_LIMIT
    SetEnv rate-limit 400

    ErrorLog ${APACHE_LOG_DIR}/epsilon-resource-planner_error.log
    CustomLog ${APACHE_LOG_DIR}/epsilon-resource-planner_access.log combined
</VirtualHost>
